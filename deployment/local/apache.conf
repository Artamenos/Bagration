<VirtualHost *:80>
  ServerName localhost
  DocumentRoot /srv/Bagration/releases/local
  Alias /content /srv/Bagration/shared/content
  Alias /media /srv/Bagration/shared/media
  <Directory /srv/Bagration>
    Require all denied
  </Directory>
  <Directory /srv/Bagration/shared/content>
    Require all granted
    Options -Indexes
  </Directory>
  <Directory /srv/Bagration/shared/media>
    Require all granted
    Options -Indexes
    AllowOverride All
  </Directory>
</VirtualHost>
<VirtualHost *:443>
  ServerName localhost
  SSLEngine on
  SSLCertificateFile /etc/apache2/local/cert.pem
  SSLCertificateKeyFile /etc/apache2/local/key.pem
  DocumentRoot /srv/Bagration/releases/local
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass /admin !
  ProxyPass /preview !
  ProxyPass /media !
  ProxyPass /content !
  ProxyPass /images !
  # Next dev needs a WebSocket handshake here, not a normal HTTP request.
  # Without Upgrade forwarding Next redirects /_next/hmr to /_next/hmr/.
  ProxyPass "/_next/hmr" "http://host.docker.internal:3000/_next/hmr" upgrade=websocket
  ProxyPass / http://host.docker.internal:3000/
  ProxyPassReverse / http://host.docker.internal:3000/
  Alias /content /srv/Bagration/shared/content
  Alias /media /srv/Bagration/shared/media
  <Directory /srv/Bagration>
    Require all granted
    AllowOverride All
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.php
  </Directory>
  <Directory /srv/Bagration/shared>
    Require all denied
  </Directory>
  <Directory /srv/Bagration/shared/content>
    Require all granted
  </Directory>
  <Directory /srv/Bagration/shared/media>
    Require all granted
  </Directory>
</VirtualHost>
